name: Research Agent Composition CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: research-agent-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test v4 research agent and composition gate
        run: python -m unittest discover -s tools/research_agent/tests -v
      - name: Recompute and verify registered plan
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.research_agent --repository-root . run \
            --plan examples/research_agent/plan.json \
            --out "$report"
          python -m tools.research_agent --repository-root . verify \
            --plan examples/research_agent/plan.json \
            --report "$report"
      - name: Test certificate composition engine
        run: python -m unittest discover -s tools/certificate_composition/tests -v
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
