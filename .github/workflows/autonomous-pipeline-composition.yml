name: Autonomous Pipeline Composition CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autonomous-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test causal composition and exact bridge synthesis
        run: python -m unittest discover -s tools/autonomous_pipeline/tests -v
      - name: Recompute and verify autonomous pipeline report
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.autonomous_pipeline analyze \
            --model examples/autonomous_pipeline/pipeline.json \
            --out "$report"
          python -m tools.autonomous_pipeline verify \
            --model examples/autonomous_pipeline/pipeline.json \
            --report "$report"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
