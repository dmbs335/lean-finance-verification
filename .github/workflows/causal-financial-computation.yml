name: Causal Financial Computation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: causal-financial-computation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test temporal noninterference
        run: python -m unittest discover -s tools/temporal_noninterference/tests -v
      - name: Test proof-carrying formula contracts
        run: python -m unittest discover -s tools/formula_contract/tests -v
      - name: Recompute exact reports
        shell: bash
        run: |
          set -euo pipefail
          temporal="$(mktemp)"
          formula="$(mktemp)"
          python -m tools.temporal_noninterference analyze \
            --model examples/temporal_noninterference/gs_quant_generic_data_source.json \
            --out "$temporal"
          python -m tools.temporal_noninterference verify \
            --model examples/temporal_noninterference/gs_quant_generic_data_source.json \
            --report "$temporal"
          python -m tools.formula_contract analyze \
            --model examples/formula_contract/hedge_scale.json \
            --out "$formula"
          python -m tools.formula_contract verify \
            --model examples/formula_contract/hedge_scale.json \
            --report "$formula"
      - name: Validate academy contract
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/causal-formula.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
