name: One-shot temporal noninterference validation

on:
  push:
    branches:
      - feature/temporal-noninterference

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/temporal-noninterference
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Integrate temporal contracts into repository navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          backtest = Path("LeanFinance/Backtest.lean")
          text = backtest.read_text(encoding="utf-8")
          imports = (
              "import LeanFinance.Backtest.TemporalNoninterference\n"
              "import LeanFinance.Backtest.TemporalNoninterferenceExample\n"
          )
          if "LeanFinance.Backtest.TemporalNoninterference" not in text:
              anchor = "import LeanFinance.Backtest.NoFutureInformation\n"
              if anchor not in text:
                  raise SystemExit("Backtest import anchor missing")
              text = text.replace(anchor, anchor + imports, 1)
              backtest.write_text(text, encoding="utf-8")
          index = Path("learning-app/index.html")
          html = index.read_text(encoding="utf-8")
          if 'data/temporal.js' not in html:
              needle = '<script src="data/composition.js"></script>'
              if needle not in html:
                  raise SystemExit("learning app script anchor missing")
              html = html.replace(needle, needle + '<script src="data/temporal.js"></script>', 1)
          html = html.replace("37개 레슨", "38개 레슨")
          index.write_text(html, encoding="utf-8")
          meta = Path("learning-app/data/meta.js")
          raw = meta.read_text(encoding="utf-8").strip()
          prefix = "window.LFV_ACADEMY = "
          if not raw.startswith(prefix) or not raw.endswith(";"):
              raise SystemExit("unexpected meta.js wrapper")
          data = json.loads(raw[len(prefix):-1])
          if not any(area["id"] == "temporal-noninterference" for area in data["coverageAreas"]):
              data["coverageAreas"].append({"id":"temporal-noninterference","label":"Temporal noninterference","paths":["LeanFinance/Backtest/TemporalNoninterference.lean","tools/temporal_noninterference/"]})
          def insert_after(values, anchor, item):
              if item in values:
                  return
              if anchor in values:
                  values.insert(values.index(anchor) + 1, item)
              else:
                  values.append(item)
          for path in data["paths"]:
              if path["id"] == "proof-carrying-backtest":
                  insert_after(path["lessonIds"], "pit-lineage", "temporal-noninterference")
              elif path["id"] == "researcher":
                  insert_after(path["lessonIds"], "pit-lineage", "temporal-noninterference")
          if not any(path["id"] == "causal-backtesting" for path in data["paths"]):
              data["paths"].append({"id":"causal-backtesting","label":"Causal Backtesting","description":"PIT lineage에서 future-extension invariance와 semantic counterexample까지 연결합니다.","lessonIds":["artifact-identity","pit-lineage","proof-carrying-certificate","temporal-noninterference","generated-ci"]})
          meta.write_text(prefix + json.dumps(data, ensure_ascii=False, indent=2) + ";\n", encoding="utf-8")
          checker = Path("tools/learning_app/check_curriculum.py")
          source = checker.read_text(encoding="utf-8")
          replacements = [
              ('    "learning-app/data/composition.js",\n','    "learning-app/data/composition.js",\n    "learning-app/data/temporal.js",\n'),
              ('    "event-study", "composition", "research-agent",','    "event-study", "composition", "temporal-noninterference", "research-agent",'),
              ('    "tools/certificate_composition", "tools/research_agent",','    "tools/certificate_composition", "tools/temporal_noninterference", "tools/research_agent",'),
              ('"data/event-study.js","data/composition.js","data/backtest.js"','"data/event-study.js","data/composition.js","data/temporal.js","data/backtest.js"'),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"curriculum checker patch anchor missing: {old!r}")
              source = source.replace(old, new, 1)
          checker.write_text(source, encoding="utf-8")
          academy_readme = Path("learning-app/README.md")
          text = academy_readme.read_text(encoding="utf-8")
          text = text.replace("six tracks, 37 lessons, and ten goal-oriented paths", "six tracks, 38 lessons, and eleven goal-oriented paths")
          text = text.replace("proof-carrying backtests, evidence separation", "proof-carrying backtests, temporal noninterference, evidence separation")
          academy_readme.write_text(text, encoding="utf-8")
          lean_ci = Path(".github/workflows/lean.yml")
          source = lean_ci.read_text(encoding="utf-8")
          step = "      - name: Test temporal noninterference and semantic fuzzer\n        run: python -m unittest discover -s tools/temporal_noninterference/tests -v\n"
          if "Test temporal noninterference and semantic fuzzer" not in source:
              anchor = "      - name: Test point-in-time data study\n        run: python -m unittest discover -s tools/pit_study/tests -v\n"
              if anchor not in source:
                  raise SystemExit("Lean CI PIT anchor missing")
              source = source.replace(anchor, step + anchor, 1)
              lean_ci.write_text(source, encoding="utf-8")
          PY
      - name: Test exact temporal semantic benchmark
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/temporal_noninterference/tests -v
          first="$(mktemp)"
          second="$(mktemp)"
          python -m tools.temporal_noninterference analyze --model examples/temporal_noninterference/gs_quant_style.json --out "$first"
          python -m tools.temporal_noninterference analyze --model examples/temporal_noninterference/gs_quant_style.json --out "$second"
          cmp "$first" "$second"
          python -m tools.temporal_noninterference verify --model examples/temporal_noninterference/gs_quant_style.json --report "$first"
      - name: Validate learning app
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/temporal.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Commit validated integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add LeanFinance/Backtest.lean learning-app/index.html learning-app/data/meta.js tools/learning_app/check_curriculum.py learning-app/README.md .github/workflows/lean.yml
          validated_tree="$(git write-tree)"
          mkdir -p .github/validation
          cat > .github/validation/temporal-noninterference-green.txt <<EOF
          validated_source_commit=${GITHUB_SHA}
          validated_tree=${validated_tree}
          python=3.12
          temporal_tests=success
          deterministic_replay=success
          curriculum=success
          lean_build=success
          EOF
          rm .github/workflows/one-shot-temporal-noninterference-validation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate and validate temporal noninterference'
          git push origin HEAD:feature/temporal-noninterference
