name: PnL Explain Closure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pnl-explain-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test PnL-explain closure
        run: python -m unittest discover -s tools/pnl_explain_closure/tests -v
      - name: Recompute and verify controlled report
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.pnl_explain_closure analyze \
            --model examples/pnl_explain_closure/controlled.json \
            --out "$report"
          python -m tools.pnl_explain_closure verify \
            --model examples/pnl_explain_closure/controlled.json \
            --report "$report"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
