name: One-shot rebase safe tree policy search

on:
  push:
    branches:
      - feature/safe-tree-policy-search-stacked

permissions:
  contents: write

jobs:
  rebase-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/safe-tree-policy-search-stacked
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reapply only the safe tree-search layer onto merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main feature/safe-tree-policy-search-stacked
          git cat-file -e origin/main:LeanFinance/Control/BeliefState.lean
          git switch -C feature/safe-tree-policy-search-clean origin/main
          git checkout origin/feature/safe-tree-policy-search-stacked -- \
            .github/workflows/safe-tree-policy-search.yml \
            LeanFinance/Control/SafeTreeSearch.lean \
            LeanFinance/Control/SafeTreeSearchExample.lean \
            docs/SAFE_TREE_POLICY_SEARCH.md \
            examples/safe_tree_search/controlled.json \
            tools/safe_tree_search/__init__.py \
            tools/safe_tree_search/__main__.py \
            tools/safe_tree_search/cli.py \
            tools/safe_tree_search/errors.py \
            tools/safe_tree_search/model.py \
            tools/safe_tree_search/solver.py \
            tools/safe_tree_search/tests/__init__.py \
            tools/safe_tree_search/tests/test_search.py \
            tools/safe_tree_search/apply_integration.py
          python tools/safe_tree_search/apply_integration.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add safe support-constrained tree policy search'
          git push --force origin HEAD:feature/safe-tree-policy-search-clean
