name: Autonomous Control Foundation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: autonomous-control-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test finite viability, shield, policy improvement, and authority
        run: python -m unittest discover -s tools/autonomous_control/tests -v
      - name: Recompute and verify controlled report
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.autonomous_control analyze \
            --model examples/autonomous_control/closed_loop.json \
            --out "$report"
          python -m tools.autonomous_control verify \
            --model examples/autonomous_control/closed_loop.json \
            --report "$report"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
