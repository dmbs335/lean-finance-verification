name: Proof-Carrying Execution CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: proof-carrying-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test lifecycle, authorization, fills, and reconciliation
        run: python -m unittest discover -s tools/execution_harness/tests -v
      - name: Recompute and verify controlled execution
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.execution_harness analyze \
            --model examples/execution_harness/controlled_buy.json \
            --out "$report"
          python -m tools.execution_harness verify \
            --model examples/execution_harness/controlled_buy.json \
            --report "$report"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
