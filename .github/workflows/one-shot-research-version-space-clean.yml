name: One-shot clean research version-space validation

on:
  push:
    branches:
      - feature/unified-research-version-space-clean

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-research-version-space-clean
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repair theorem and integrate current repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          theory = Path('LeanFinance/Epistemic/ResearchVersionSpace.lean')
          source = theory.read_text(encoding='utf-8')
          old = '''  grind

end ResearchVersionSpace'''
          new = '''  have upperLeLower : exactRange.upper ≤ exactRange.lower :=
    le_trans upperLeMetric metricLeLower
  exact le_antisymm exactRange.ordered upperLeLower

end ResearchVersionSpace'''
          if old not in source:
              raise SystemExit('point-identification proof anchor missing')
          theory.write_text(source.replace(old, new, 1), encoding='utf-8')

          epistemic = Path('LeanFinance/Epistemic.lean')
          source = epistemic.read_text(encoding='utf-8')
          for line in (
              'import LeanFinance.Epistemic.ResearchVersionSpace\n',
              'import LeanFinance.Epistemic.ResearchVersionSpaceExample\n',
          ):
              if line not in source:
                  source += line
          epistemic.write_text(source, encoding='utf-8')

          index = Path('learning-app/index.html')
          html = index.read_text(encoding='utf-8')
          if 'data/research-version-space.js' not in html:
              needle = '<script src="data/formula.js"></script>'
              if needle not in html:
                  raise SystemExit('formula script anchor missing')
              html = html.replace(
                  needle,
                  needle + '<script src="data/research-version-space.js"></script>',
                  1,
              )
          html = html.replace('39개 레슨', '40개 레슨')
          html = html.replace(
              'formula contract, temporal noninterference, CEGIS',
              'research version space, formula contract, temporal noninterference',
          )
          index.write_text(html, encoding='utf-8')

          meta = Path('learning-app/data/meta.js')
          raw = meta.read_text(encoding='utf-8').strip()
          prefix = 'window.LFV_ACADEMY = '
          if not raw.startswith(prefix) or not raw.endswith(';'):
              raise SystemExit('unexpected meta.js wrapper')
          data = json.loads(raw[len(prefix):-1])
          if not any(area['id'] == 'research-version-space' for area in data['coverageAreas']):
              data['coverageAreas'].append({
                  'id': 'research-version-space',
                  'label': 'Unified research version space',
                  'paths': [
                      'LeanFinance/Epistemic/ResearchVersionSpace.lean',
                      'LeanFinance/Epistemic/ResearchVersionSpaceExample.lean',
                      'tools/research_version_space/',
                  ],
              })

          def insert_after(values, anchor, item):
              if item in values:
                  return
              position = values.index(anchor) + 1 if anchor in values else len(values)
              values.insert(position, item)

          for learning_path in data['paths']:
              ids = learning_path['lessonIds']
              if learning_path['id'] == 'evidence-theory':
                  insert_after(ids, 'version-space', 'research-version-space')
              elif learning_path['id'] == 'hidden-investment-laws':
                  insert_after(ids, 'version-space', 'research-version-space')
              elif learning_path['id'] == 'researcher':
                  insert_after(ids, 'version-space', 'research-version-space')
              elif learning_path['id'] == 'finance-models':
                  insert_after(ids, 'alpha-uncertainty', 'research-version-space')
          if not any(path['id'] == 'unified-research-version-space' for path in data['paths']):
              data['paths'].append({
                  'id': 'unified-research-version-space',
                  'label': 'Unified Research Version Space',
                  'description': 'PIT·model·search·execution·universe uncertainty를 하나의 certifiable range로 합칩니다.',
                  'lessonIds': [
                      'version-space',
                      'temporal-noninterference',
                      'alpha-uncertainty',
                      'formula-contract',
                      'research-version-space',
                      'certificate-composition',
                  ],
              })
          meta.write_text(
              prefix + json.dumps(data, ensure_ascii=False, indent=2) + ';\n',
              encoding='utf-8',
          )

          checker = Path('tools/learning_app/check_curriculum.py')
          source = checker.read_text(encoding='utf-8')
          source = source.replace(
              '"learning-app/data/composition.js", "learning-app/data/temporal.js",\n',
              '"learning-app/data/composition.js", "learning-app/data/temporal.js",\n    "learning-app/data/formula.js", "learning-app/data/research-version-space.js",\n',
              1,
          )
          source = source.replace(
              '"event-study", "composition", "research-agent",',
              '"event-study", "composition", "research-version-space", "research-agent",',
              1,
          )
          source = source.replace(
              '"tools/certificate_composition", "tools/temporal_noninterference",\n    "tools/research_agent",',
              '"tools/certificate_composition", "tools/temporal_noninterference",\n    "tools/formula_contract", "tools/research_version_space",\n    "tools/research_agent",',
              1,
          )
          source = source.replace(
              '"data/event-study.js","data/composition.js","data/temporal.js","data/backtest.js",',
              '"data/event-study.js","data/composition.js","data/temporal.js","data/formula.js","data/research-version-space.js","data/backtest.js",',
              1,
          )
          for required in (
              'learning-app/data/formula.js',
              'learning-app/data/research-version-space.js',
              'research-version-space',
              'tools/formula_contract',
              'tools/research_version_space',
              'data/research-version-space.js',
          ):
              if required not in source:
                  raise SystemExit(f'checker integration failed for {required}')
          checker.write_text(source, encoding='utf-8')

          academy = Path('learning-app/README.md')
          text = academy.read_text(encoding='utf-8')
          text = text.replace('39 lessons', '40 lessons')
          text = text.replace(
              'proof-carrying formula applications, evidence separation',
              'proof-carrying formula applications, unified research version spaces, evidence separation',
          )
          academy.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Unified research version space\n'
          if marker not in text:
              section = '''\n\n## Unified research version space\n\n`LeanFinance/Epistemic/ResearchVersionSpace.lean` and `tools/research_version_space/` represent one complete research world as data vintage, model version, adaptive search history, execution semantics, and universe/security resolution. Evidence restricts the admissible world family; exact lower and upper metric certificates are provably nested under refinement.\n\nThe controlled analyzer enumerates 32 worlds and 64 evidence portfolios, synthesizes the minimum-cost evidence meeting a target interval width, emits lower-cost world-pair counterexamples, and computes exact Shapley attribution including interaction effects. See `docs/UNIFIED_RESEARCH_VERSION_SPACE.md`.\n'''
              insertion = text.find('\n## Repository layout')
              if insertion == -1:
                  text += section
              else:
                  text = text[:insertion] + section + text[insertion:]
              readme.write_text(text, encoding='utf-8')
          PY
      - name: Test exact research-world calculus
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/research_version_space/tests -v
          first="$(mktemp)"
          second="$(mktemp)"
          python -m tools.research_version_space analyze \
            --model examples/research_version_space/five_dimensions.json \
            --out "$first"
          python -m tools.research_version_space analyze \
            --model examples/research_version_space/five_dimensions.json \
            --out "$second"
          cmp "$first" "$second"
          python -m tools.research_version_space verify \
            --model examples/research_version_space/five_dimensions.json \
            --report "$first"
      - name: Validate current academy contract
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/research-version-space.js
          node --check learning-app/data/formula.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Commit validated clean integration
        shell: bash
        run: |
          set -euo pipefail
          git add LeanFinance/Epistemic/ResearchVersionSpace.lean \
            LeanFinance/Epistemic.lean README.md learning-app/index.html \
            learning-app/data/meta.js learning-app/README.md \
            tools/learning_app/check_curriculum.py
          validated_tree="$(git write-tree)"
          mkdir -p .github/validation
          cat > .github/validation/research-version-space-green.txt <<EOF
          validated_source_commit=${GITHUB_SHA}
          validated_tree=${validated_tree}
          python=3.12
          version_space_tests=success
          deterministic_replay=success
          shapley_efficiency=success
          refinement_checks=success
          curriculum=success
          lean_build=success
          EOF
          rm .github/workflows/one-shot-research-version-space-clean.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate and validate unified research version space'
          git push origin HEAD:feature/unified-research-version-space-clean
