name: One-shot ALFRED revision validation

on:
  push:
    branches:
      - feature/alfred-revision-leakage

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/alfred-revision-leakage
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile ALFRED modules
        run: python -m compileall -q tools/pit_study
      - name: Test PIT studies including ALFRED leakage
        run: python -m unittest discover -s tools/pit_study/tests -v
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Record successful one-shot validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/validation
          printf 'validated_commit=%s\npython=3.12\nlean_build=success\n' \
            "$GITHUB_SHA" > .github/validation/alfred-revision-green.txt
          rm .github/workflows/one-shot-alfred-validation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record ALFRED revision-leakage validation'
          git push origin HEAD:feature/alfred-revision-leakage
