name: Certificate Composition CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: certificate-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test exact certificate composition
        run: python -m unittest discover -s tools/certificate_composition/tests -v
      - name: Recompute and verify composition report
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.certificate_composition analyze \
            --model examples/certificate_composition/research_bundle.json \
            --out "$report"
          python -m tools.certificate_composition verify \
            --model examples/certificate_composition/research_bundle.json \
            --report "$report"
      - name: Validate academy contract
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/composition.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
