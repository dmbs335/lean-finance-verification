name: One-shot PnL explain closure validation

on:
  push:
    branches:
      - feature/pnl-explain-closure

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/pnl-explain-closure
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Integrate PnL lesson and coverage contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('learning-app/index.html')
          html = index.read_text(encoding='utf-8')
          if 'data/pnl.js' not in html:
              needle = '<script src="data/curriculum.js"></script>'
              if needle not in html:
                  raise SystemExit('curriculum script tag not found')
              html = html.replace(needle, '<script src="data/pnl.js"></script>' + needle)
          html = html.replace('39개 레슨', '40개 레슨')
          html = html.replace(
              '금융 모델부터 causal backtest와 proof-carrying formula application까지 연결합니다.',
              '금융 모델부터 causal backtest, proof-carrying formula와 PnL closure까지 연결합니다.',
          )
          index.write_text(html, encoding='utf-8')

          meta = Path('learning-app/data/meta.js')
          raw = meta.read_text(encoding='utf-8').strip()
          prefix = 'window.LFV_ACADEMY = '
          if not raw.startswith(prefix) or not raw.endswith(';'):
              raise SystemExit('unexpected meta.js wrapper')
          data = json.loads(raw[len(prefix):-1])
          if not any(area['id'] == 'pnl-explain' for area in data['coverageAreas']):
              data['coverageAreas'].append({
                  'id': 'pnl-explain',
                  'label': 'Proof-carrying PnL explain closure',
                  'paths': ['LeanFinance/PnL.lean', 'LeanFinance/PnL/', 'tools/pnl_explain_closure/'],
              })

          def insert_after(items, anchor, value):
              if value in items:
                  return
              position = items.index(anchor) + 1 if anchor in items else len(items)
              items.insert(position, value)

          for learning_path in data['paths']:
              ids = learning_path['lessonIds']
              if learning_path['id'] == 'finance-models':
                  insert_after(ids, 'alpha-uncertainty', 'pnl-explain-closure')
              elif learning_path['id'] == 'proof-carrying-backtest':
                  insert_after(ids, 'formula-contract', 'pnl-explain-closure')
              elif learning_path['id'] == 'researcher':
                  insert_after(ids, 'formula-contract', 'pnl-explain-closure')
          if not any(path['id'] == 'pnl-explain' for path in data['paths']):
              data['paths'].append({
                  'id': 'pnl-explain',
                  'label': 'Proof-Carrying PnL Explain',
                  'description': 'Taylor attribution에서 residual closure와 same-pipeline binding까지 연결합니다.',
                  'lessonIds': ['temporal-noninterference', 'formula-contract', 'certificate-composition', 'pnl-explain-closure'],
              })
          meta.write_text(prefix + json.dumps(data, ensure_ascii=False, indent=2) + ';\n', encoding='utf-8')

          checker = Path('tools/learning_app/check_curriculum.py')
          source = checker.read_text(encoding='utf-8')
          replacements = [
              ('"learning-app/data/formula.js",\n', '"learning-app/data/formula.js",\n    "learning-app/data/pnl.js",\n'),
              ('"formula-contract", "research-agent",', '"formula-contract", "pnl-explain", "research-agent",'),
              ('"tools/formula_contract", "tools/research_agent",', '"tools/formula_contract", "tools/pnl_explain_closure", "tools/research_agent",'),
              ('"data/temporal.js","data/formula.js","data/curriculum.js",', '"data/temporal.js","data/formula.js","data/pnl.js","data/curriculum.js",'),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'curriculum checker anchor missing: {old!r}')
              source = source.replace(old, new, 1)
          checker.write_text(source, encoding='utf-8')

          academy_readme = Path('learning-app/README.md')
          text = academy_readme.read_text(encoding='utf-8')
          text = text.replace('39 lessons', '40 lessons').replace('39개 레슨', '40개 레슨')
          if 'proof-carrying PnL explain closure' not in text:
              text += '\n\nThe finance research path also covers proof-carrying PnL explain closure: exact local formula checks, temporal and model binding, residual tolerance, and CLOSED/PARTIAL/OPEN classification.\n'
          academy_readme.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '### Proof-carrying PnL explain closure\n'
          if marker not in text:
              text += '''\n\n### Proof-carrying PnL explain closure\n\n`LeanFinance/PnL/` and `tools/pnl_explain_closure/` separate local first/second-order attribution arithmetic from global portfolio, market-data, model-version, temporal, and realized-result binding. A CLOSED explanation additionally requires the realized-minus-reconstructed residual to remain within a preregistered tolerance. The controlled GS Quant mapping is static/theory-only and does not claim direct upstream runtime execution.\n'''
          readme.write_text(text, encoding='utf-8')
          PY
      - name: Test exact PnL closure
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/pnl_explain_closure/tests -v
          first="$(mktemp)"
          second="$(mktemp)"
          python -m tools.pnl_explain_closure analyze --model examples/pnl_explain_closure/controlled.json --out "$first"
          python -m tools.pnl_explain_closure analyze --model examples/pnl_explain_closure/controlled.json --out "$second"
          cmp "$first" "$second"
          python -m tools.pnl_explain_closure verify --model examples/pnl_explain_closure/controlled.json --report "$first"
      - name: Validate academy
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/pnl.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Commit tested integration and green marker
        shell: bash
        run: |
          set -euo pipefail
          git add README.md learning-app/index.html learning-app/data/meta.js learning-app/README.md tools/learning_app/check_curriculum.py
          validated_tree="$(git write-tree)"
          mkdir -p .github/validation
          cat > .github/validation/pnl-explain-closure-green.txt <<EOF
          validated_source_commit=${GITHUB_SHA}
          validated_tree=${validated_tree}
          python=3.12
          pnl_tests=success
          deterministic_reproduction=success
          curriculum=success
          lean_build=success
          gs_quant_direct_runtime=not_executed
          gs_quant_static_target=fa9dd42f0677a0d2fb5819fca6e2f67de9458c06
          EOF
          rm .github/workflows/one-shot-vendor-rebase.yml
          rm -f .github/workflows/one-shot-pnl-explain-validation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate and validate PnL explain closure'
          git push origin HEAD:feature/pnl-explain-closure
