name: Temporal Noninterference CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: temporal-noninterference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test temporal noninterference and semantic fuzzer
        run: python -m unittest discover -s tools/temporal_noninterference/tests -v
      - name: Recompute and verify controlled report
        shell: bash
        run: |
          set -euo pipefail
          first="$(mktemp)"
          second="$(mktemp)"
          python -m tools.temporal_noninterference analyze \
            --model examples/temporal_noninterference/gs_quant_style.json \
            --out "$first"
          python -m tools.temporal_noninterference analyze \
            --model examples/temporal_noninterference/gs_quant_style.json \
            --out "$second"
          cmp "$first" "$second"
          python -m tools.temporal_noninterference verify \
            --model examples/temporal_noninterference/gs_quant_style.json \
            --report "$first"
      - name: Validate academy contract
        run: |
          python -m tools.learning_app.check_curriculum
          python -m unittest discover -s tools/learning_app/tests -v
          node --check learning-app/data/temporal.js
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
