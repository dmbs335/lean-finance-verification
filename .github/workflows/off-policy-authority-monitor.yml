name: Off-Policy Authority Monitor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: off-policy-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test exact off-policy monitor and authority governor
        run: python -m unittest discover -s tools/policy_monitor/tests -v
      - name: Recompute and verify monitor report
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          python -m tools.policy_monitor analyze \
            --model examples/policy_monitor/off_policy.json \
            --out "$report"
          python -m tools.policy_monitor verify \
            --model examples/policy_monitor/off_policy.json \
            --report "$report"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
