name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Record OpenSSL verifier version
        run: openssl version -a
      - name: Test Python reference adapter
        run: python -m unittest discover -s tools/lfv_adapter/tests -v
      - name: Test exact evidence synthesizer
        run: python -m unittest discover -s tools/evidence_synth/tests -v
      - name: Test workflow counterexample-guided synthesis
        run: python -m unittest discover -s tools/workflow_cegis/tests -v
      - name: Test observed attack-trace refinement
        run: python -m unittest discover -s tools/trace_refinement/tests -v
      - name: Test evidence-obligation taxonomy
        run: python -m unittest discover -s tools/evidence_taxonomy/tests -v
      - name: Generate evidence taxonomy report
        run: >-
          python -m tools.evidence_taxonomy synth
          --spec examples/evidence_taxonomy/cost_model_novelty.json
          --out examples/evidence_taxonomy/generated/taxonomy.canonical.json
      - name: Commit generated taxonomy report once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add examples/evidence_taxonomy/generated/taxonomy.canonical.json
          if git diff --cached --quiet; then
            echo "taxonomy report already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin evidence-obligation taxonomy report"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Check observed trace refinement reproducibility
        run: >-
          python -m tools.trace_refinement check-generated
          --model examples/workflow_cegis/search_integrity.json
          --trace examples/trace_refinement/cost_model_tampering.trace.json
          --refined-model examples/trace_refinement/generated/refined-model.canonical.json
          --refinement-report examples/trace_refinement/generated/refinement-report.canonical.json
          --workflow-report examples/trace_refinement/generated/workflow-report.canonical.json
          --evidence-model examples/trace_refinement/generated/evidence-model.canonical.json
          --synthesis examples/trace_refinement/generated/global-synthesis.canonical.json
          --repair-synthesis examples/trace_refinement/generated/repair-synthesis.canonical.json
          --workflow-lean LeanFinance/Generated/ObservedCostModelTampering/Search.lean
          --evidence-lean LeanFinance/Generated/ObservedCostModelTampering/Evidence.lean
          --bridge-lean LeanFinance/Generated/ObservedCostModelTampering/CEGIS.lean
          --trace-lean LeanFinance/Generated/ObservedCostModelTampering/TraceRefinement.lean
      - name: Check generated backtest certificate reproducibility
        run: >-
          python -m tools.lfv_adapter check-generated
          --spec examples/reference_adapter/experiment.json
          --bundle examples/reference_adapter/generated/bundle.canonical.json
          --lean LeanFinance/Generated/ReferenceAdapter.lean
          --allow-local-anchor
      - name: Check generated evidence synthesis reproducibility
        run: >-
          python -m tools.evidence_synth check-generated
          --model examples/evidence_synthesis/search_completeness.json
          --certificate examples/evidence_synthesis/generated/synthesis.canonical.json
          --lean LeanFinance/Generated/EvidenceSynthesis.lean
      - name: Reproduce workflow CEGIS artifacts
        shell: bash
        run: |
          set -euo pipefail
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          generate() {
            local out="$1"
            python -m tools.workflow_cegis synth \
              --model examples/workflow_cegis/search_integrity.json \
              --report "$out/report.canonical.json" \
              --evidence-model "$out/evidence-model.canonical.json" \
              --synthesis "$out/global-synthesis.canonical.json" \
              --repair-synthesis "$out/repair-synthesis.canonical.json" \
              --workflow-lean "$out/WorkflowSearch.lean" \
              --evidence-lean "$out/WorkflowEvidence.lean" \
              --bridge-lean "$out/WorkflowCEGIS.lean"
          }
          generate "$first"
          generate "$second"
          for artifact in \
            report.canonical.json \
            evidence-model.canonical.json \
            global-synthesis.canonical.json \
            repair-synthesis.canonical.json \
            WorkflowSearch.lean \
            WorkflowEvidence.lean \
            WorkflowCEGIS.lean
          do
            cmp "$first/$artifact" "$second/$artifact"
          done
          cmp "$first/WorkflowSearch.lean" LeanFinance/Generated/WorkflowSearch.lean
          cmp "$first/WorkflowEvidence.lean" LeanFinance/Generated/WorkflowEvidence.lean
          cmp "$first/WorkflowCEGIS.lean" LeanFinance/Generated/WorkflowCEGIS.lean
          python -m tools.workflow_cegis verify \
            --model examples/workflow_cegis/search_integrity.json \
            --report "$first/report.canonical.json"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
