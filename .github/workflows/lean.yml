name: Lean CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Record OpenSSL verifier version
        run: openssl version -a
      - name: Test Python reference adapter
        run: python -m unittest discover -s tools/lfv_adapter/tests -v
      - name: Test exact evidence synthesizer
        run: python -m unittest discover -s tools/evidence_synth/tests -v
      - name: Test workflow counterexample-guided synthesis
        run: python -m unittest discover -s tools/workflow_cegis/tests -v
      - name: Test observed attack-trace refinement
        run: python -m unittest discover -s tools/trace_refinement/tests -v
      - name: Generate and pin observed trace refinement artifacts
        shell: bash
        run: |
          set -euo pipefail
          json_out="examples/trace_refinement/generated"
          lean_out="LeanFinance/Generated/ObservedCostModelTampering"
          mkdir -p "$json_out" "$lean_out"
          python -m tools.trace_refinement refine \
            --model examples/workflow_cegis/search_integrity.json \
            --trace examples/trace_refinement/cost_model_tampering.trace.json \
            --refined-model "$json_out/refined-model.canonical.json" \
            --refinement-report "$json_out/refinement-report.canonical.json" \
            --workflow-report "$json_out/workflow-report.canonical.json" \
            --evidence-model "$json_out/evidence-model.canonical.json" \
            --synthesis "$json_out/global-synthesis.canonical.json" \
            --repair-synthesis "$json_out/repair-synthesis.canonical.json" \
            --workflow-lean "$lean_out/Search.lean" \
            --evidence-lean "$lean_out/Evidence.lean" \
            --bridge-lean "$lean_out/CEGIS.lean" \
            --trace-lean "$lean_out/TraceRefinement.lean"
      - name: Commit generated trace refinement artifacts once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git add examples/trace_refinement/generated LeanFinance/Generated/ObservedCostModelTampering
          if git diff --cached --quiet; then
            echo "generated artifacts already pinned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pin observed attack trace refinement artifacts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Check generated backtest certificate reproducibility
        run: >-
          python -m tools.lfv_adapter check-generated
          --spec examples/reference_adapter/experiment.json
          --bundle examples/reference_adapter/generated/bundle.canonical.json
          --lean LeanFinance/Generated/ReferenceAdapter.lean
          --allow-local-anchor
      - name: Check generated evidence synthesis reproducibility
        run: >-
          python -m tools.evidence_synth check-generated
          --model examples/evidence_synthesis/search_completeness.json
          --certificate examples/evidence_synthesis/generated/synthesis.canonical.json
          --lean LeanFinance/Generated/EvidenceSynthesis.lean
      - name: Reproduce workflow CEGIS artifacts
        shell: bash
        run: |
          set -euo pipefail
          first="$(mktemp -d)"
          second="$(mktemp -d)"
          generate() {
            local out="$1"
            python -m tools.workflow_cegis synth \
              --model examples/workflow_cegis/search_integrity.json \
              --report "$out/report.canonical.json" \
              --evidence-model "$out/evidence-model.canonical.json" \
              --synthesis "$out/global-synthesis.canonical.json" \
              --repair-synthesis "$out/repair-synthesis.canonical.json" \
              --workflow-lean "$out/WorkflowSearch.lean" \
              --evidence-lean "$out/WorkflowEvidence.lean" \
              --bridge-lean "$out/WorkflowCEGIS.lean"
          }
          generate "$first"
          generate "$second"
          for artifact in \
            report.canonical.json \
            evidence-model.canonical.json \
            global-synthesis.canonical.json \
            repair-synthesis.canonical.json \
            WorkflowSearch.lean \
            WorkflowEvidence.lean \
            WorkflowCEGIS.lean
          do
            cmp "$first/$artifact" "$second/$artifact"
          done
          cmp "$first/WorkflowSearch.lean" LeanFinance/Generated/WorkflowSearch.lean
          cmp "$first/WorkflowEvidence.lean" LeanFinance/Generated/WorkflowEvidence.lean
          cmp "$first/WorkflowCEGIS.lean" LeanFinance/Generated/WorkflowCEGIS.lean
          python -m tools.workflow_cegis verify \
            --model examples/workflow_cegis/search_integrity.json \
            --report "$first/report.canonical.json"
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
